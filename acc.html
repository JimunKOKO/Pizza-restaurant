<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Account - Pizza Kon Khmer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="acc.css">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script defer src="acc.js"></script>
</head>

<body>
    <main class="auth-card">
        <a href="index.html" class="text-decoration-none">← Back to Store</a>
        <h2 class="mt-3">Pizza Kon Khmer</h2>
        <p id="authSubtitle">Login to your account</p>
        
        <form id="authForm">
            <div class="mb-3" id="nameGroup" hidden>
                <label class="form-label">Full Name</label>
                <input id="authName" class="form-control">
            </div>
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input id="authEmail" type="email" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input id="authPassword" type="password" minlength="6" class="form-control" required>
            </div>
            <button class="btn btn-danger w-100" id="submitBtn">Login</button>
        </form>

        <p class="mt-3 mb-0"><a href="#" id="toggleAuth">Create an account</a></p>

        <div id="loggedIn" hidden>
            <p id="welcome" class="fw-bold"></p>
            <a class="btn btn-danger" href="page.html">My Dashboard</a> 
            <button class="btn btn-outline-secondary" id="logoutBtn" type="button">Logout</button>
        </div>
    </main>
</body>

</html>
