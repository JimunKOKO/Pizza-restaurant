<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>User Dashboard - Pizza Kon Khmer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="page.css">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script defer src="page.js"></script>
</head>

<body>

    <nav class="navbar navbar-dark py-3">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <b style="color:#c9362b">PIZZA</b>
                <em style="color:#d9a441">Kon Khmer</em>
            </a>
            <a href="index.html" class="btn btn-outline-warning btn-sm"> Back to Store</a>
        </div>
    </nav>

    <!-- dashboad to see -->
    <div class="container py-5">
        <div class="row g-4">
            <div class="col-lg-3">
                <div class="card dashboard-card p-3">
                    <div class="text-center py-3 border-bottom mb-3">
                        <div class="avatar-circle mb-2">
                            <i class="bi bi-person-fill"></i>
                        </div>
                        <h6 id="sidebarUserName"></h6><small id="sidebarUserEmail" class="text-muted"></small>
                    </div>
                    <div class="list-group sidebar-menu" role="tablist">
                        <a class="list-group-item list-group-item-action active" data-bs-toggle="list"
                            href="#profilePane"> Profile Overview</a>
                        <a class="list-group-item list-group-item-action" id="orders-tab" data-bs-toggle="list"
                            href="#ordersPane"> My Orders</a>
                        <a class="list-group-item list-group-item-action" data-bs-toggle="list"
                            href="#addressPane">Saved Addresses</a>
                        <a class="list-group-item list-group-item-action" data-bs-toggle="list" href="#settingsPane">
                            Preferences</a>
                    </div><button id="logoutBtn" class="btn btn-outline-danger mt-3">Logout</button>
                </div>
            </div>
            <!-- end  -->

            <div class="col-lg-9">
                <div class="card dashboard-card p-4 p-md-5">
                    <div class="tab-content">
                        <div class="tab-pane fade show active" id="profilePane">
                            <h4 class="mb-4">Dashboard Overview</h4>
                            <div class="row g-3 mb-4">
                                <div class="col-md-4">
                                    <div class="stat-box text-center"><small>Total Orders</small>
                                        <h3 id="totalOrdersCount">0</h3>
                                    </div>
                                </div>
                                <div class="col-md-4">
                                    <div class="stat-box text-center"><small>Total Spent</small>
                                        <h3 id="totalSpentAmount">$0.00</h3>
                                    </div>
                                </div>
                                <div class="col-md-4">
                                    <div class="stat-box text-center"><small>Loyalty Tier</small>
                                        <h3> Member</h3>
                                    </div>
                                </div>
                            </div>

                            <!-- Form  -->
                            <h5>Account Information</h5>
                            <form id="profileForm">
                                <div class="row g-3">
                                    <div class="col-md-6"><label class="form-label">Full Name</label><input
                                            id="formName" class="form-control" required></div>
                                    <div class="col-md-6"><label class="form-label">Email Address</label><input
                                            id="formEmail" class="form-control" type="email" required></div>
                                    <div class="col-md-6"><label class="form-label">Phone Number</label><input
                                            id="formPhone" class="form-control"></div>
                                    <div class="col-md-6"><label class="form-label">City</label><input
                                            class="form-control" value="Phnom Penh" readonly></div>
                                </div><button class="btn btn-danger mt-4">Save Profile</button>
                            </form>
                        </div>

                        <!-- to check histroy -->
                        <div class="tab-pane fade" id="ordersPane">
                            <h4>Order History</h4>
                            <div id="ordersListContainer"></div>
                        </div>
                        <!-- delivery Addresses -->

                        <div class="tab-pane fade" id="addressPane">
                            <h4>Delivery Addresses</h4>
                            <p class="text-muted">Add your address for future reference.</p>
                            <form id="addressForm">
                                <input class="form-control mb-3" id="addressInput" placeholder="Street, district, Phnom Penh">
                                <button class="btn btn-danger">Save Address</button>
                            </form>
                            <p id="savedAddress" class="mt-3"></p>
                        </div>

                        <div class="tab-pane fade" id="settingsPane">
                            <h4>Account Preferences</h4>

                            <label class="d-block my-3">
                                <input type="checkbox" id="promoEmails"> Receive special offer alerts
                            </label>

                            <label class="d-block">
                                <input type="checkbox" id="smsNotifications"> SMS delivery notifications
                            </label>

                            <buttonid="savePrefs" class="btn btn-danger mt-3">Save Preferences</button>
                        </div>

                    </div>
                </div>
            </div>

        </div>
    </div>
</body>

</html>
